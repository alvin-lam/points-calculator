<!doctype html><html><head><meta charset="utf-8">
<!-- Source for icons/og-image.png (1200 x 630). Open it in a browser at 1200 x 630 and take a screenshot to remake the image. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@500;700&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px}
body{background:linear-gradient(135deg,#f6f8fc 0%,#e6eefc 100%);font-family:Inter,system-ui,sans-serif;color:#14213d;display:flex;align-items:center;padding:0 90px;box-sizing:border-box;position:relative;overflow:hidden}
.ring{position:absolute;right:-140px;top:-120px;width:620px;height:620px;border-radius:50%;border:60px solid rgba(31,95,209,.07)}
.icon{width:180px;height:180px;border-radius:40px;box-shadow:0 20px 50px rgba(20,33,61,.18);margin-right:64px;flex:none}
.brand{font-family:"Instrument Serif",serif;color:#1f5fd1;font-size:54px;margin:0 0 6px}
h1{font-size:68px;line-height:1.05;margin:0 0 22px;font-weight:700;letter-spacing:-.02em}
p{font-size:30px;line-height:1.35;margin:0;color:#46526b;font-weight:500;max-width:760px}
.chips{margin-top:30px;display:flex;gap:12px}
.chips span{background:#1f5fd1;color:#fff;border-radius:999px;padding:10px 22px;font-size:22px;font-weight:700}
</style></head><body><div class="ring"></div>
<img class="icon" src="../docs/icons/icon-512.png">
<div><p class="brand">All Trips Considered</p><h1>Airline Points<br>Calculator</h1>
<p>Estimate the miles you will earn on any flight.</p>
<div class="chips"><span>100+ airlines</span><span>Free</span><span>No sign-up</span></div></div>
</body></html>
